    <script>
        function unlock() {
            const pass = document.getElementById('pw').value.trim();
            
            const encrypted = document.getElementById('encrypted-data').textContent.trim();
            let decrypted;
            try {
                const bytes = CryptoJS.AES.decrypt(encrypted, pass);
                decrypted = bytes.toString(CryptoJS.enc.Utf8);
            } catch (err) {
                decrypted = "";
            }

            if (!decrypted) {
                document.getElementById('msg').textContent = "❌ Wrong password";
                return;
            }
            console.log("set password: ", pass)
            localStorage.setItem("unlock-password", pass);
            document.body.innerHTML = decrypted;
            // Execute embedded scripts (since innerHTML doesn’t run <script> by default)
            const scripts = document.body.querySelectorAll("script");
            for (const old of scripts) {
                const s = document.createElement("script");
                if (old.src) s.src = old.src;
                else s.textContent = old.textContent;
                document.body.appendChild(s);
            }
        }
    </script>

    <script>
    const pass = localStorage.getItem("unlock-password");
    if(pass) {
        document.getElementById('pw').value = pass;
        unlock();
    }
</script>
